name: Build desktop binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dots-windows-x64.exe
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            artifact: Dots-macos-aarch64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/dots.exe ${{ matrix.artifact }}
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p Dots.app/Contents/MacOS
          cp packaging/macos/Info.plist Dots.app/Contents/Info.plist
          cp target/${{ matrix.target }}/release/dots Dots.app/Contents/MacOS/Dots
          chmod +x Dots.app/Contents/MacOS/Dots
          ditto -c -k --sequesterRsrc --keepParent Dots.app ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
